# ─── SonarCloud project configuration ───────────────────────────────────────
# Values must exactly match SonarCloud:
# Organization key = your GitHub username/org key
# Project key      = shown in Project Settings → General (usually owner_repo)
sonar.organization=pratik-rupani
sonar.projectKey=pratik-rupani_veryfi-poc

sonar.projectName=Receipt Parser
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests,e2e
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions= \
  node_modules/**, \
  .next/**, \
  src/components/ui/**, \
  src/hooks/**, \
  src/integrations/supabase/types.ts, \
  **/*.d.ts
